# Sample site for the api-reference template.
#
# The theme is installed into docs/theme/ from the local checkout
# (fetch-theme.sh --source ..), and this config INHERITs the installed
# base. The docs/theme/ tree is generated, not committed. Only
# site-specific keys and the i18n languages live here; everything shared
# comes from the base.
INHERIT: docs/theme/mkdocs-base.yml
site_name: Sample API Reference
site_description: Sample site for the api-reference template

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          build: true
          default: true
          nav:
            - Home: index.md
        - locale: ko
          name: 한국어
          build: true
          nav:
            - Home: index.md
          nav_translations:
            Home: 홈
