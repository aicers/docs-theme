name: Docs

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libcairo2 libffi-dev
          pip install mkdocs-material mkdocs-static-i18n mkdocs-with-pdf

      - name: Install theme into samples (local source)
        run: ./scripts/install-samples.sh

      - name: Build HTML samples
        run: |
          mkdir -p site
          cp samples/index.html site/
          # This site deploys on every push to main, so it shows
          # unreleased state no consumer can yet install. Stamp the built
          # revision onto the landing page so an evaluator is not misled
          # about what they are looking at.
          SHORT_SHA="${GITHUB_SHA:0:7}"
          COMMIT_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          sed -i \
            "s|<span id=\"build-revision\">Preview build from the local working tree</span>|Built from <a href=\"${COMMIT_URL}\">${SHORT_SHA}</a> on $(date -u +%Y-%m-%d)|" \
            site/index.html
          for sample_dir in samples/*/; do
            name="$(basename "$sample_dir")"
            if [ -f "$sample_dir/mkdocs.yml" ]; then
              mkdocs build -f "$sample_dir/mkdocs.yml" -d "../../site/$name"
            fi
          done

      - name: Build PDFs
        run: |
          mkdir -p site/pdf
          for sample_dir in samples/*/; do
            name="$(basename "$sample_dir")"
            if [ ! -f "$sample_dir/mkdocs.yml" ]; then
              continue
            fi
            template_pdf="templates/$name/pdf"
            if [ ! -d "$template_pdf" ]; then
              continue
            fi
            for locale in en ko; do
              if [ ! -d "$sample_dir/docs/$locale" ]; then
                continue
              fi
              python3 scripts/ci-build-pdf.py \
                --sample "$sample_dir" \
                --template "$name" \
                --locale "$locale" \
                --output "site/pdf/${name}.${locale}.pdf"
            done
          done

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy Docs
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
