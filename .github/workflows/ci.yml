name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '-dispatch' || (github.run_attempt != '1' && format('-rerun-{0}', github.run_id) || '') }}
  cancel-in-progress: true

jobs:
  build-html:
    name: Build HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install mkdocs-material mkdocs-static-i18n

      - name: Install theme into samples (local source)
        run: ./scripts/install-samples.sh

      - name: Build all samples (HTML)
        run: |
          for sample_dir in samples/*/; do
            name="$(basename "$sample_dir")"
            if [ -f "$sample_dir/mkdocs.yml" ]; then
              echo "Building $name (HTML)..."
              mkdocs build -f "$sample_dir/mkdocs.yml" --strict -d "../../site-ci/$name"
            fi
          done

      - name: Verify theme delivery in built sites
        run: |
          # --strict fails on broken links, not on a stylesheet or font
          # that 404s. Assert the theme's assets actually reached each
          # built site/ directory, reading extra_css and theme.logo from
          # the resolved config so the check tracks mkdocs-base.yml.
          for sample_dir in samples/*/; do
            name="$(basename "$sample_dir")"
            if [ -f "$sample_dir/mkdocs.yml" ]; then
              echo "Verifying theme delivery for $name..."
              python3 scripts/verify-theme-delivery.py \
                --config "$sample_dir/mkdocs.yml" \
                --site "site-ci/$name"
            fi
          done

  build-pdf:
    name: Build PDF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # `apt-get update` fails when any source cannot be refreshed instead of
      # only warning, apt retries each download three times (the hosted image
      # sets one), and the step gives up after 10 minutes rather than holding
      # the runner for the job's 6 hours.
      - name: Install dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq --error-on=any -o Acquire::Retries=3
          sudo apt-get install -y -qq -o Acquire::Retries=3 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libcairo2 libffi-dev
          pip install mkdocs-material mkdocs-static-i18n mkdocs-with-pdf

      - name: Install theme into samples (local source)
        run: ./scripts/install-samples.sh

      - name: Build all samples (PDF)
        run: |
          for sample_dir in samples/*/; do
            name="$(basename "$sample_dir")"
            if [ ! -f "$sample_dir/mkdocs.yml" ]; then
              continue
            fi
            template_pdf="templates/$name/pdf"
            if [ ! -d "$template_pdf" ]; then
              continue
            fi
            for locale in en ko; do
              if [ ! -d "$sample_dir/docs/$locale" ]; then
                continue
              fi
              echo "Building $name (PDF $locale)..."
              python3 scripts/ci-build-pdf.py \
                --sample "$sample_dir" \
                --template "$name" \
                --locale "$locale" \
                --output "site-ci/pdf/${name}.${locale}.pdf"
            done
          done

  test-installer:
    name: Test Installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install mkdocs-material mkdocs-static-i18n

      - name: Install fixture projects with fetch-theme.sh
        run: ./tests/installer-test.sh

  test-pdf-script:
    name: Test PDF Script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # `apt-get update` fails when any source cannot be refreshed instead of
      # only warning, apt retries each download three times (the hosted image
      # sets one), and the step gives up after 10 minutes rather than holding
      # the runner for the job's 6 hours.
      - name: Install dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq --error-on=any -o Acquire::Retries=3
          sudo apt-get install -y -qq -o Acquire::Retries=3 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libcairo2 libffi-dev poppler-utils
          pip install mkdocs-material mkdocs-static-i18n mkdocs-with-pdf

      - name: Build fixture PDFs with build-docs-pdf.sh
        run: ./tests/pdf-test.sh

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        id: checkout

      - uses: DavidAnson/markdownlint-cli2-action@v25

      # Fails when the shared instruction blocks in AGENTS.md stop matching
      # the aicers/agent-instructions release `.agent-instructions.toml`
      # pins -- because a generated region was edited here, or because an
      # update pull request was never merged. It sits in this job so that
      # a drift failure fails `Markdown`, a required check.
      #
      # `@main`: the scripts are mechanism and come from `main`, while the
      # blocks are content and come from the pin. No `with:`, because the
      # release and the blocks to compare are both read from that file.
      #
      # `!cancelled()` rather than the default `success()`, so a lint
      # failure above does not skip it: a drifted block is drift whether or
      # not some other Markdown file breaks a rule. The `checkout` clause
      # keeps a failed checkout from being reported as drift.
      - name: Check shared instruction-block drift
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: aicers/agent-instructions/check-drift@main

  lint-shell:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: scripts
          additional_files: "*.sh"

      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: tests
          additional_files: "*.sh"

  test-release-surface:
    name: Test Release Surface Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Exercise check-release-surface.sh on throwaway repositories
        run: ./tests/release-surface-test.sh

  # The release pull request release-please keeps open is merged only
  # after CI is dispatched on its branch, and this is the run that has to
  # stop a release whose surface -- what fetch-theme.sh installs, plus
  # fetch-theme.sh itself -- equals the last release's. Such a release
  # would hand every consumer an empty-diff version bump, so the pull
  # request stays open until a change to the surface lands. Every other
  # run skips the job, which `CI Gate` counts as passing.
  release-surface:
    name: Release Surface
    if: >-
      github.event_name == 'workflow_dispatch'
      && startsWith(github.ref, 'refs/heads/release-please--')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The guard reads the last version tag's tree, so the job needs the
      # full history and the tags. actions/checkout is shallow and tagless
      # by default, which would let the guard pass by comparing against
      # nothing.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Compare the release surface with the last version tag
        run: ./scripts/check-release-surface.sh

  gate:
    name: CI Gate
    runs-on: ubuntu-latest
    permissions: {}
    needs:
      - build-html
      - build-pdf
      - test-installer
      - test-pdf-script
      - test-release-surface
      - markdown
      - lint-shell
      - release-surface
    if: ${{ always() }}
    steps:
      - name: Assert every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "${RESULTS}"
          bad="$(printf '%s' "${RESULTS}" \
            | jq -r 'to_entries[]
                     | select(.value.result != "success" and .value.result != "skipped")
                     | "  \(.key): \(.value.result)"')"
          if [ -n "${bad}" ]; then
            echo "Not green:" >&2
            echo "${bad}" >&2
            exit 1
          fi
